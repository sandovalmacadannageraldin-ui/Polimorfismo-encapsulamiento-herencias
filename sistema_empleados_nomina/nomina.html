<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de empleados y nómina</title>
    <link rel="stylesheet" href="nomina.css">
</head>
<body>

    <h1>Gestión de empleados y nómina</h1>

    <h2>Registrar empleado</h2>

    <label>Identificación:</label>
    <input type="text" id="identificacion">

    <label>Nombre completo:</label>
    <input type="text" id="nombre">

    <label>Tipo de vinculación:</label>
    <select id="tipo">
        <option value="planta">Empleado de planta</option>
        <option value="contratista">Contratista</option>
    </select>

    <label>Salario mensual o tarifa por hora:</label>
    <input type="number" id="remuneracion" step="any">

    <label>Horas trabajadas (solo contratistas):</label>
    <input type="number" id="horas" step="any" value="0">

    <button onclick="registrarEmpleado()">Registrar empleado</button>

    <p id="mensaje"></p>

    <h2>Empleados registrados</h2>

    <table>
        <thead>
            <tr>
                <th>Identificación</th>
                <th>Nombre</th>
                <th>Vinculación</th>
                <th>Salario o tarifa</th>
                <th>Horas</th>
                <th>Pago calculado</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody id="tablaEmpleados"></tbody>
    </table>

    <h2>Total de la nómina</h2>

    <p id="totalNomina">Total: $0</p>

    <script src="nomina.js"></script>

</body>
</html>
