<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de transporte</title>
    <link rel="stylesheet" href="transporte.css">
</head>
<body>

    <h1>Sistema de transporte</h1>

    <h2>Registrar vehículo</h2>

    <label>Identificador o placa:</label>
    <input type="text" id="identificador">

    <label>Tipo de vehículo:</label>
    <select id="tipo">
        <option value="automovil">Automóvil</option>
        <option value="motocicleta">Motocicleta</option>
        <option value="bicicleta">Bicicleta</option>
    </select>

    <label>Capacidad de pasajeros:</label>
    <input type="number" id="capacidad">

    <button onclick="registrarVehiculo()">Registrar vehículo</button>

    <p id="mensaje"></p>

    <h2>Vehículos registrados</h2>

    <table>
        <thead>
            <tr>
                <th>Identificador</th>
                <th>Tipo</th>
                <th>Capacidad</th>
                <th>Estado</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody id="tablaVehiculos"></tbody>
    </table>

    <h2>Registrar viaje</h2>

    <label>Identificador del vehículo:</label>
    <input type="text" id="idViaje">

    <label>Distancia del viaje en kilómetros:</label>
    <input type="number" id="distancia" step="any">

    <button onclick="registrarViaje()">Registrar viaje</button>

    <h2>Historial de viajes</h2>

    <table>
        <thead>
            <tr>
                <th>Vehículo</th>
                <th>Tipo</th>
                <th>Distancia</th>
                <th>Costo</th>
                <th>Estado del viaje</th>
            </tr>
        </thead>
        <tbody id="tablaViajes"></tbody>
    </table>

    <script src="transporte.js"></script>

</body>
</html>
